name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, please use a private report instead (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server / REST API
        - MCP endpoint
        - Web UI
        - Client CLI (@isqanderm/skills-registry)
        - Search / embeddings
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including error messages or logs (remove tokens and passwords).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit or image tag of the server, and/or CLI version (`npm ls -g @isqanderm/skills-registry`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Docker / Compose version, browser, reverse proxy, EMBEDDER setting — whatever is relevant.
