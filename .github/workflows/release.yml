# Release: on a v* tag,
# - build the Docker image for linux/amd64 and linux/arm64 and push it to GHCR as
#   ghcr.io/<owner>/<repo> with semver tags (1.2.3, 1.2, 1, latest);
# - publish the client CLI (packages/cli) to npm through trusted publishing (OIDC, no stored
#   token; provenance is attached automatically). The tag must match the CLI's package.json
#   version. npm must list this repository and release.yml as the package's trusted publisher.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != CLI version $version"; exit 1; }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:cli
      # pnpm pack rewrites workspace: ranges; trusted publishing needs npm >= 11.5.1.
      - name: Publish
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@isqanderm/skills-registry@$version" version >/dev/null 2>&1; then
            echo "::notice::@isqanderm/skills-registry@$version is already on npm"
            exit 0
          fi
          pnpm pack --out package.tgz
          npx --yes npm@11.6.2 publish package.tgz --access public
