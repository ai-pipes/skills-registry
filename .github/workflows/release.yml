# Release: on a v* tag,
# - build the Docker image for linux/amd64 and linux/arm64 and push it to GHCR as
#   ghcr.io/<owner>/<repo> with semver tags (1.2.3, 1.2, 1, latest);
# - publish the client CLI (packages/cli) to npm with provenance. The tag must match the CLI's
#   package.json version. Skipped while the NPM_TOKEN secret is not set.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; the CLI is not published"
      - if: env.NODE_AUTH_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.NODE_AUTH_TOKEN != ''
        uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - if: env.NODE_AUTH_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: env.NODE_AUTH_TOKEN != ''
        name: Tag matches the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != CLI version $version"; exit 1; }
      - if: env.NODE_AUTH_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.NODE_AUTH_TOKEN != ''
        run: pnpm build:cli
      # pnpm publish rewrites workspace: ranges; provenance comes from publishConfig.
      - if: env.NODE_AUTH_TOKEN != ''
        run: pnpm --filter @isqanderm/skills-registry publish --no-git-checks
